name: Bug Report
description: Report an unexpected behavior or crash in Piku
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Launch Piku
        2. Click on ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: input
    id: piku_version
    attributes:
      label: Piku version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: Windows version & display setup
      placeholder: "Windows 11 24H2 x64, 1 monitor @ 125% scaling"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context or screenshots
      description: Optional screenshots (please avoid sharing personal files or sensitive app history).
